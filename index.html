<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>足立康與FOOTER進貨點貨計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f8fafc; color: #0f172a; padding-bottom: 110px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen selection:bg-amber-200">

  <header class="sticky top-0 z-50 bg-slate-900 text-amber-400 px-3 sm:px-4 py-2.5 flex justify-between items-center whitespace-nowrap h-14 shadow-md border-b-2 border-amber-500">
    <div class="text-lg sm:text-xl font-black tracking-tight flex items-center gap-2 min-w-0 flex-1 mr-2 text-white">
      <span class="flex-shrink-0 text-amber-400">📦</span> 
      <span class="truncate">進貨點貨計算器</span>
    </div>
    <div class="flex items-center gap-1.5 flex-shrink-0">
      <button onclick="openHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-amber-300 active:bg-slate-600 px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-black tracking-wide transition-all active:scale-95 h-9 flex items-center justify-center border border-amber-500/40">
        📜 歷史 <span id="historyBadge" class="ml-1 px-1.5 py-0.2 bg-amber-500 text-slate-950 text-[10px] rounded-full hidden">0</span>
      </button>
      <button onclick="clearAllQuantities()" class="bg-slate-800 hover:bg-slate-700 text-amber-300 active:bg-slate-600 px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-black tracking-wide transition-all active:scale-95 h-9 flex items-center justify-center border border-amber-500/40">
        🗑️ 清空
      </button>
      <button onclick="openManageItemsModal()" class="bg-slate-800 hover:bg-slate-700 text-amber-300 active:bg-slate-600 px-2.5 py-1.5 rounded-xl text-xs sm:text-sm font-black tracking-wide transition-all active:scale-95 h-9 flex items-center justify-center border border-amber-500/40">
        ⚙️ 管理
      </button>
      <button onclick="openAddItemModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 active:bg-amber-600 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black shadow-sm transition-all active:scale-95 h-9 flex items-center justify-center">
        ➕ 新增
      </button>
    </div>
  </header>

  <div class="sticky top-14 z-40 bg-white/95 backdrop-blur-md border-b border-amber-200/60 shadow-2xs">
    <div class="flex overflow-x-auto no-scrollbar px-3 py-2 gap-2 items-center" id="categoryBar">
      <!-- Categories dynamically inserted -->
    </div>
    <div class="px-3 pb-2.5 pt-0.5">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-base">🔍</span>
        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="快速搜尋商品名稱..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all text-slate-900 placeholder-slate-400">
      </div>
    </div>
  </div>

  <main class="max-w-xl mx-auto p-2.5 sm:p-3.5" id="itemList">
    <!-- Item cards dynamically inserted -->
  </main>

  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t-2 border-amber-500 px-4 py-2.5 flex justify-between items-center z-50 shadow-2xl">
    <div>
      <div class="text-sm sm:text-base font-black text-amber-300 mb-0.5" id="footerTotalQty">已選：0 打 0 雙</div>
      <div class="text-xl sm:text-2xl font-black text-white tracking-tight" id="footerTotalPrice">總金額：$0</div>
    </div>
    <button onclick="openSummaryModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-5 py-2.5 rounded-xl text-base sm:text-lg font-black shadow-md transition-all active:scale-95 flex items-center gap-2">
      <span>📋</span> 訂單總結
    </button>
  </footer>

  <!-- Summary Modal -->
  <div id="summaryModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden items-center justify-center p-3.5">
    <div class="bg-white rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden shadow-2xl border border-amber-300">
      <div class="bg-slate-900 text-amber-400 px-5 py-3.5 flex justify-between items-center border-b border-amber-500/30">
        <h3 class="text-xl sm:text-2xl font-black flex items-center gap-2 text-white"><span>📋</span> 訂單總結明細</h3>
        <button onclick="closeModal('summaryModal')" class="text-amber-400 hover:text-white text-2xl font-bold p-1 transition-colors">✕</button>
      </div>
      <div class="p-4 sm:p-5 overflow-y-auto flex-1 divide-y divide-slate-100" id="summaryModalContent">
        <!-- Summary items -->
      </div>
      <div class="p-3.5 bg-slate-50 border-t border-slate-200 flex flex-col gap-2">
        <button onclick="markAsCheckedOut()" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 py-3 rounded-xl font-black text-lg shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2 border border-amber-500">
          <span>✅</span> 標記已結帳並存入紀錄
        </button>
        <button onclick="copyLineMessage()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-black text-lg shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2">
          <span>📋</span> 複製 LINE 點貨訊息
        </button>
      </div>
    </div>
  </div>

  <!-- History Records Modal -->
  <div id="historyModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden items-center justify-center p-3.5">
    <div class="bg-white rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden shadow-2xl border border-amber-300">
      <div class="bg-slate-900 text-amber-400 px-5 py-3.5 flex justify-between items-center border-b border-amber-500/30">
        <h3 class="text-xl sm:text-2xl font-black flex items-center gap-2 text-white"><span>📜</span> 已結帳歷史紀錄</h3>
        <button onclick="closeModal('historyModal')" class="text-amber-400 hover:text-white text-2xl font-bold p-1 transition-colors">✕</button>
      </div>
      <div class="p-4 sm:p-5 overflow-y-auto flex-1 space-y-3" id="historyModalContent">
        <!-- History cards dynamically rendered -->
      </div>
      <div class="p-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
        <button onclick="clearAllHistory()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold px-3 py-2 rounded-xl text-xs border border-rose-300">清空所有紀錄</button>
        <button onclick="closeModal('historyModal')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-xl text-sm">關閉</button>
      </div>
    </div>
  </div>

  <div id="itemModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden items-center justify-center p-3.5">
    <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-200">
      <div class="bg-slate-900 text-amber-400 px-5 py-3.5 flex justify-between items-center">
        <h3 class="text-lg sm:text-xl font-black text-white" id="itemModalTitle">新增商品</h3>
        <button onclick="closeModal('itemModal')" class="text-amber-400 hover:text-white text-2xl font-bold p-1 transition-colors">✕</button>
      </div>
      <div class="p-4 sm:p-5 space-y-3.5">
        <input type="hidden" id="editItemId">
        <div>
          <label class="block text-sm font-black text-slate-800 mb-1">商品名稱</label>
          <input type="text" id="itemNameInput" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all" placeholder="例如：足立康健康襪">
        </div>
        <div>
          <label class="block text-sm font-black text-slate-800 mb-1">所屬分類</label>
          <select id="itemCatSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all"></select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black text-slate-800 mb-1">一打進價 ($)</label>
            <input type="number" id="itemDozenPriceInput" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all" placeholder="720">
          </div>
          <div>
            <label class="block text-sm font-black text-slate-800 mb-1">一雙進價 ($)</label>
            <input type="number" id="itemPairPriceInput" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all" placeholder="60">
          </div>
        </div>
      </div>
      <div class="p-3.5 bg-slate-50 border-t border-slate-200">
        <button onclick="saveItem()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 py-3 rounded-xl font-black text-lg shadow-sm transition-all active:scale-95">儲存商品</button>
      </div>
    </div>
  </div>

  <div id="manageItemsModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden items-center justify-center p-3.5">
    <div class="bg-white rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden shadow-2xl border border-slate-200">
      <div class="bg-slate-900 text-amber-400 px-5 py-3.5 flex justify-between items-center">
        <h3 class="text-lg sm:text-xl font-black text-white">⚙️ 商品與排序管理</h3>
        <button onclick="closeModal('manageItemsModal')" class="text-amber-400 hover:text-white text-2xl font-bold p-1 transition-colors">✕</button>
      </div>
      <div class="p-4 sm:p-5 overflow-y-auto flex-1 space-y-5">
        <div>
          <h4 class="font-black text-slate-900 text-base mb-2">分類管理</h4>
          <div class="flex gap-2 mb-2.5">
            <input type="text" id="newCatInput" class="flex-1 p-2 bg-slate-50 border border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all" placeholder="新分類名稱">
            <button onclick="addCategory()" class="bg-slate-900 hover:bg-slate-800 text-amber-400 px-4 rounded-xl text-base font-black shadow-2xs transition-all active:scale-95">新增</button>
          </div>
          <div id="categoryManageList" class="divide-y divide-slate-200 bg-slate-50 p-2 rounded-xl border border-slate-200"></div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <h4 class="font-black text-slate-900 text-base">商品排序與清單</h4>
            <span class="text-xs font-bold text-slate-500">使用 ⬆️ ⬇️ 調整順序</span>
          </div>
          <div id="itemManageList" class="divide-y divide-slate-200 bg-slate-50 p-2 rounded-xl border border-slate-200"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_PREFIX = 'zulin_stock_calculator_v2_';
    
    const defaultItems = [
      { id: '1', name: '足立康一般', category: '足立康', dozenPrice: 660, pairPrice: 55 },
      { id: '2', name: '足立康健康襪', category: '足立康', dozenPrice: 720, pairPrice: 60 },
      { id: '3', name: 'FOOTER', category: 'FOOTER', dozenPrice: 1260, pairPrice: 105 },
      { id: '4', name: 'FOOTER長款', category: 'FOOTER', dozenPrice: 1440, pairPrice: 120 },
      { id: '5', name: '一般袖套', category: '袖套類', dozenPrice: 240, pairPrice: 20 },
      { id: '6', name: '露趾袖套', category: '袖套類', dozenPrice: 260, pairPrice: 22 },
      { id: '7', name: '抹布', category: '雜貨毛巾', dozenPrice: 83, pairPrice: 7 },
      { id: '8', name: '黃標襪', category: '一般襪類', dozenPrice: 100, pairPrice: 9 },
      { id: '9', name: '一般襪子', category: '一般襪類', dozenPrice: 168, pairPrice: 14 },
      { id: '10', name: 'FP901', category: '特別款', dozenPrice: 840, pairPrice: 70 },
      { id: '11', name: 'FP105(更長款)', category: '特別款', dozenPrice: 1080, pairPrice: 90 },
      { id: '12', name: '運動毛巾', category: '雜貨毛巾', dozenPrice: 360, pairPrice: 30 }
    ];

    let categories = [];
    let items = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let itemQuantities = {};
    let checkoutHistory = [];

    function loadData() {
      try {
        const storedCats = localStorage.getItem(STORAGE_PREFIX + 'categories');
        categories = storedCats ? JSON.parse(storedCats) : ['足立康', 'FOOTER', '袖套類', '一般襪類', '特別款', '雜貨毛巾'];
      } catch (e) {
        categories = ['足立康', 'FOOTER', '袖套類', '一般襪類', '特別款', '雜貨毛巾'];
      }

      try {
        const storedItems = localStorage.getItem(STORAGE_PREFIX + 'items');
        items = storedItems ? JSON.parse(storedItems) : defaultItems;
      } catch (e) {
        items = defaultItems;
      }

      try {
        const storedQtys = localStorage.getItem(STORAGE_PREFIX + 'quantities');
        itemQuantities = storedQtys ? JSON.parse(storedQtys) : {};
      } catch (e) {
        itemQuantities = {};
      }

      try {
        const storedHistory = localStorage.getItem(STORAGE_PREFIX + 'checkout_history');
        checkoutHistory = storedHistory ? JSON.parse(storedHistory) : [];
      } catch (e) {
        checkoutHistory = [];
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_PREFIX + 'categories', JSON.stringify(categories));
        localStorage.setItem(STORAGE_PREFIX + 'items', JSON.stringify(items));
        localStorage.setItem(STORAGE_PREFIX + 'quantities', JSON.stringify(itemQuantities));
        localStorage.setItem(STORAGE_PREFIX + 'checkout_history', JSON.stringify(checkoutHistory));
      } catch (e) {
        console.error('儲存資料至 localStorage 失敗:', e);
      }
    }

    function init() {
      loadData();
      renderCategories();
      renderItems();
      updateTotal();
      updateHistoryBadge();
    }

    function updateHistoryBadge() {
      const badge = document.getElementById('historyBadge');
      if (checkoutHistory.length > 0) {
        badge.innerText = checkoutHistory.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function renderCategories() {
      const bar = document.getElementById('categoryBar');
      let html = `<button onclick="switchCategory('all')" class="flex-shrink-0 h-9 px-3.5 rounded-xl font-black text-sm sm:text-base transition-all ${currentCategory === 'all' ? 'bg-amber-500 text-slate-950 shadow-2xs font-extrabold' : 'bg-slate-200 text-slate-800 hover:bg-slate-300'}">全部</button>`;
      
      categories.forEach(cat => {
        html += `<button onclick="switchCategory('${cat}')" class="flex-shrink-0 h-9 px-3.5 rounded-xl font-black text-sm sm:text-base transition-all ${currentCategory === cat ? 'bg-amber-500 text-slate-950 shadow-2xs font-extrabold' : 'bg-slate-200 text-slate-800 hover:bg-slate-300'}">${cat}</button>`;
      });

      bar.innerHTML = html;
    }

    function switchCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderItems();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById('itemList');
      let filtered = currentCategory === 'all' ? items : items.filter(i => i.category === currentCategory);

      if (searchQuery) {
        filtered = filtered.filter(i => i.name.toLowerCase().includes(searchQuery));
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-slate-400 font-bold text-base">沒有找到符合的商品</div>`;
        return;
      }

      let html = '';
      filtered.forEach(item => {
        const qty = itemQuantities[item.id] || { dozen: 0, pair: 0 };
        const hasQty = qty.dozen > 0 || qty.pair > 0;
        const subtotal = (qty.dozen * item.dozenPrice) + (qty.pair * item.pairPrice);

        const cardStyle = hasQty 
          ? 'bg-amber-50/70 border-2 border-amber-500 shadow-md ring-1 ring-amber-400/30' 
          : 'bg-white border border-slate-200/90 shadow-2xs';

        const subtotalBadgeStyle = hasQty
          ? 'bg-amber-500 text-slate-950 font-black border border-amber-600/30'
          : 'bg-slate-100 text-slate-700 font-bold border border-slate-200';

        const boxBgStyle = 'bg-slate-100/80 border-slate-300';

        html += `
          <div class="rounded-2xl p-3 mb-2.5 transition-all ${cardStyle}">
            <div class="flex justify-between items-center gap-2 mb-1.5">
              <h2 class="text-xl sm:text-2xl font-black text-slate-950 leading-tight tracking-tight flex-1 truncate">${item.name}</h2>
              ${hasQty ? `<div class="flex-shrink-0 bg-amber-500 text-slate-950 text-xs sm:text-sm font-black px-2.5 py-1 rounded-lg border border-amber-600/30 shadow-2xs">✅ 已點 ${qty.dozen}打 ${qty.pair}雙</div>` : ''}
            </div>

            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="text-sm sm:text-base font-black text-slate-700">
                打 $<span class="text-slate-900">${item.dozenPrice}</span> / 雙 $<span class="text-slate-900">${item.pairPrice}</span>
              </div>
              <div class="text-sm sm:text-base px-2.5 py-0.5 rounded-lg ${subtotalBadgeStyle}">
                小計：$<span class="text-base sm:text-lg font-black">${subtotal}</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="rounded-xl p-1.5 border ${boxBgStyle}">
                <div class="text-xs sm:text-sm font-black text-slate-700 text-center mb-1">打數</div>
                <div class="flex items-center justify-between px-1">
                  <button onclick="changeQty('${item.id}', 'dozen', -1)" class="w-11 h-11 bg-white hover:bg-slate-200 active:bg-slate-300 text-slate-900 rounded-xl text-2xl font-black transition-all flex items-center justify-center select-none border border-slate-300 shadow-2xs active:scale-95">-</button>
                  <input type="number" readonly value="${qty.dozen}" class="w-12 text-center text-3xl font-black bg-transparent text-slate-900 focus:outline-none">
                  <button onclick="changeQty('${item.id}', 'dozen', 1)" class="w-11 h-11 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-white rounded-xl text-2xl font-black transition-all flex items-center justify-center select-none border border-slate-900 shadow-2xs active:scale-95">+</button>
                </div>
              </div>

              <div class="rounded-xl p-1.5 border ${boxBgStyle}">
                <div class="text-xs sm:text-sm font-black text-slate-700 text-center mb-1">雙數</div>
                <div class="flex items-center justify-between px-1">
                  <button onclick="changeQty('${item.id}', 'pair', -1)" class="w-11 h-11 bg-white hover:bg-slate-200 active:bg-slate-300 text-slate-900 rounded-xl text-2xl font-black transition-all flex items-center justify-center select-none border border-slate-300 shadow-2xs active:scale-95">-</button>
                  <input type="number" readonly value="${qty.pair}" class="w-12 text-center text-3xl font-black bg-transparent text-slate-900 focus:outline-none">
                  <button onclick="changeQty('${item.id}', 'pair', 1)" class="w-11 h-11 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-white rounded-xl text-2xl font-black transition-all flex items-center justify-center select-none border border-slate-900 shadow-2xs active:scale-95">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function changeQty(id, type, delta) {
      if (!itemQuantities[id]) itemQuantities[id] = { dozen: 0, pair: 0 };
      let val = itemQuantities[id][type] + delta;
      if (val < 0) val = 0;
      itemQuantities[id][type] = val;
      saveData();
      renderItems();
      updateTotal();
    }

    function clearAllQuantities() {
      if (confirm('確定要清空所有已輸入的點貨數量嗎？')) {
        itemQuantities = {};
        saveData();
        renderItems();
        updateTotal();
      }
    }

    function updateTotal() {
      let totalDozen = 0, totalPair = 0, totalPrice = 0;
      items.forEach(item => {
        const qty = itemQuantities[item.id];
        if (qty) {
          totalDozen += qty.dozen;
          totalPair += qty.pair;
          totalPrice += (qty.dozen * item.dozenPrice) + (qty.pair * item.pairPrice);
        }
      });
      document.getElementById('footerTotalQty').innerText = `已選：${totalDozen} 打 ${totalPair} 雙`;
      document.getElementById('footerTotalPrice').innerText = `總金額：$${totalPrice}`;
    }

    function openSummaryModal() {
      const content = document.getElementById('summaryModalContent');
      let html = '', totalPrice = 0, hasItem = false;

      items.forEach(item => {
        const qty = itemQuantities[item.id];
        if (qty && (qty.dozen > 0 || qty.pair > 0)) {
          hasItem = true;
          const subtotal = (qty.dozen * item.dozenPrice) + (qty.pair * item.pairPrice);
          totalPrice += subtotal;

          let qtyStr = '';
          if (qty.dozen > 0) qtyStr += `${qty.dozen}打 `;
          if (qty.pair > 0) qtyStr += `${qty.pair}雙`;

          html += `
            <div class="py-3 flex items-center justify-between gap-3">
              <span class="text-xl sm:text-2xl font-black text-slate-950 truncate flex-1">${item.name}</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xl sm:text-2xl font-black text-amber-600">${qtyStr}</span>
                <span class="text-lg sm:text-xl font-black text-slate-900">($${subtotal})</span>
              </div>
            </div>
          `;
        }
      });

      if (!hasItem) {
        html = `<div class="text-center py-12 text-slate-400 font-bold text-lg">目前尚未輸入任何點貨數量</div>`;
      } else {
        html += `
          <div class="pt-4 mt-2 border-t-2 border-slate-200 flex justify-between items-center">
            <span class="text-xl font-black text-slate-900">總計金額</span>
            <span class="text-2xl sm:text-3xl font-black text-amber-600">$${totalPrice}</span>
          </div>
        `;
      }

      content.innerHTML = html;
      document.getElementById('summaryModal').classList.remove('hidden');
      document.getElementById('summaryModal').classList.add('flex');
    }

    function markAsCheckedOut() {
      const orderItems = [];
      let totalPrice = 0;

      items.forEach(item => {
        const qty = itemQuantities[item.id];
        if (qty && (qty.dozen > 0 || qty.pair > 0)) {
          const subtotal = (qty.dozen * item.dozenPrice) + (qty.pair * item.pairPrice);
          totalPrice += subtotal;
          let qtyStr = '';
          if (qty.dozen > 0) qtyStr += `${qty.dozen}打 `;
          if (qty.pair > 0) qtyStr += `${qty.pair}雙`;

          orderItems.push({
            name: item.name,
            qtyStr,
            subtotal
          });
        }
      });

      if (orderItems.length === 0) {
        alert('目前沒有已選擇的商品，無法儲存結帳！');
        return;
      }

      const now = new Date();
      const timeStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      const record = {
        id: Date.now().toString(),
        date: timeStr,
        totalPrice,
        items: orderItems
      };

      checkoutHistory.unshift(record);
      itemQuantities = {};
      saveData();
      renderItems();
      updateTotal();
      updateHistoryBadge();
      closeModal('summaryModal');
      
      openHistoryModal();
    }

    function openHistoryModal() {
      renderHistoryList();
      document.getElementById('historyModal').classList.remove('hidden');
      document.getElementById('historyModal').classList.add('flex');
    }

    function renderHistoryList() {
      const container = document.getElementById('historyModalContent');
      if (checkoutHistory.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 font-bold text-lg">尚無已結帳歷史紀錄</div>`;
        return;
      }

      let html = '';
      checkoutHistory.forEach(record => {
        html += `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden shadow-2xs hover:border-slate-300 transition-all">
            <div class="bg-slate-100 px-3.5 py-2.5 border-b border-slate-200 flex justify-between items-center gap-2">
              <span class="text-xs sm:text-sm font-black text-slate-600 flex items-center gap-1">
                <span>📅</span> ${record.date}
              </span>
              <button onclick="deleteHistoryRecord('${record.id}')" class="bg-rose-100 hover:bg-rose-200 active:bg-rose-300 text-rose-700 border border-rose-300 px-2.5 py-1 rounded-lg text-xs font-black transition-all active:scale-95 flex items-center gap-1 flex-shrink-0">
                <span>🗑️</span> 刪除紀錄
              </button>
            </div>

            <details class="group">
              <summary class="p-3.5 flex justify-between items-center cursor-pointer select-none bg-white hover:bg-amber-50/50 transition-colors">
                <div class="flex items-center gap-2">
                  <span class="text-amber-500 font-black text-lg transition-transform group-open:rotate-90">▶</span>
                  <span class="text-lg sm:text-xl font-black text-slate-900">總金額：$${record.totalPrice}</span>
                </div>
                <span class="text-xs font-bold text-slate-400 group-open:hidden">點擊展開明細 ▾</span>
                <span class="text-xs font-bold text-amber-600 hidden group-open:inline">點擊收合 ▴</span>
              </summary>
              
              <div class="px-4 pb-3.5 pt-2 bg-slate-50/80 border-t border-slate-100 space-y-1.5">
                ${record.items.map(item => `
                  <div class="flex justify-between items-center text-sm sm:text-base border-b border-slate-200/60 pb-1 last:border-0">
                    <span class="font-bold text-slate-800">${item.name}</span>
                    <span class="font-black text-slate-900">${item.qtyStr} <span class="text-slate-500 font-normal">($${item.subtotal})</span></span>
                  </div>
                `).join('')}
              </div>
            </details>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function deleteHistoryRecord(id) {
      if (confirm('確定要刪除此筆已結帳紀錄嗎？')) {
        checkoutHistory = checkoutHistory.filter(r => r.id !== id);
        saveData();
        renderHistoryList();
        updateHistoryBadge();
      }
    }

    function clearAllHistory() {
      if (confirm('確定要清空所有已結帳歷史紀錄嗎？')) {
        checkoutHistory = [];
        saveData();
        renderHistoryList();
        updateHistoryBadge();
      }
    }

    function copyLineMessage() {
      let msg = "📋 【進貨點貨清單】\n----------------\n", totalPrice = 0, hasItem = false;
      items.forEach(item => {
        const qty = itemQuantities[item.id];
        if (qty && (qty.dozen > 0 || qty.pair > 0)) {
          hasItem = true;
          const subtotal = (qty.dozen * item.dozenPrice) + (qty.pair * item.pairPrice);
          totalPrice += subtotal;
          let qtyStr = '';
          if (qty.dozen > 0) qtyStr += `${qty.dozen}打 `;
          if (qty.pair > 0) qtyStr += `${qty.pair}雙`;
          msg += `${item.name}：${qtyStr} ($${subtotal})\n`;
        }
      });

      if (!hasItem) return;
      msg += `----------------\n總金額：$${totalPrice}`;

      const textarea = document.createElement('textarea');
      textarea.value = msg;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span>✅</span> 已成功複製到剪貼簿！';
        btn.classList.remove('bg-emerald-600');
        btn.classList.add('bg-amber-600');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('bg-amber-600');
          btn.classList.add('bg-emerald-600');
        }, 2000);
      } catch (err) {
        console.error('複製失敗', err);
      }
      document.body.removeChild(textarea);
    }

    function openAddItemModal() {
      document.getElementById('itemModalTitle').innerText = '新增商品';
      document.getElementById('editItemId').value = '';
      document.getElementById('itemNameInput').value = '';
      document.getElementById('itemDozenPriceInput').value = '';
      document.getElementById('itemPairPriceInput').value = '';
      const select = document.getElementById('itemCatSelect');
      select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('itemModal').classList.add('flex');
    }

    function openEditItemModal(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      document.getElementById('itemModalTitle').innerText = '編輯商品';
      document.getElementById('editItemId').value = item.id;
      document.getElementById('itemNameInput').value = item.name;
      document.getElementById('itemDozenPriceInput').value = item.dozenPrice;
      document.getElementById('itemPairPriceInput').value = item.pairPrice;
      
      const select = document.getElementById('itemCatSelect');
      select.innerHTML = categories.map(c => `<option value="${c}" ${c === item.category ? 'selected' : ''}>${c}</option>`).join('');
      
      closeModal('manageItemsModal');
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('itemModal').classList.add('flex');
    }

    function saveItem() {
      const editId = document.getElementById('editItemId').value;
      const name = document.getElementById('itemNameInput').value.trim();
      const category = document.getElementById('itemCatSelect').value;
      const dozenPrice = parseFloat(document.getElementById('itemDozenPriceInput').value) || 0;
      const pairPrice = parseFloat(document.getElementById('itemPairPriceInput').value) || 0;

      if (!name) return;

      if (editId) {
        const item = items.find(i => i.id === editId);
        if (item) {
          item.name = name;
          item.category = category;
          item.dozenPrice = dozenPrice;
          item.pairPrice = pairPrice;
        }
      } else {
        items.push({ id: Date.now().toString(), name, category, dozenPrice, pairPrice });
      }

      saveData();
      renderItems();
      closeModal('itemModal');
    }

    function deleteItem(id) {
      if (confirm('確定要刪除這項商品嗎？')) {
        items = items.filter(i => i.id !== id);
        delete itemQuantities[id];
        saveData();
        renderItems();
        renderItemManageList();
        updateTotal();
      }
    }

    function moveItemOrder(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= items.length) return;
      const temp = items[index];
      items[index] = items[targetIndex];
      items[targetIndex] = temp;
      saveData();
      renderItems();
      renderItemManageList();
    }

    function openManageItemsModal() {
      renderCategoryManageList();
      renderItemManageList();
      document.getElementById('manageItemsModal').classList.remove('hidden');
      document.getElementById('manageItemsModal').classList.add('flex');
    }

    function renderCategoryManageList() {
      const list = document.getElementById('categoryManageList');
      list.innerHTML = categories.map((cat, idx) => `
        <div class="py-2 flex justify-between items-center text-base">
          <span class="font-black text-slate-900">${cat}</span>
          <button onclick="deleteCategory(${idx})" class="bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-all">刪除</button>
        </div>
      `).join('');
    }

    function addCategory() {
      const input = document.getElementById('newCatInput');
      const val = input.value.trim();
      if (val && !categories.includes(val)) {
        categories.push(val);
        input.value = '';
        saveData();
        renderCategories();
        renderCategoryManageList();
      }
    }

    function deleteCategory(idx) {
      categories.splice(idx, 1);
      saveData();
      renderCategories();
      renderCategoryManageList();
    }

    function renderItemManageList() {
      const list = document.getElementById('itemManageList');
      list.innerHTML = items.map((item, idx) => `
        <div class="py-2.5 flex justify-between items-center text-sm">
          <div class="pr-2 flex-1 min-w-0">
            <div class="font-black text-slate-900 text-base truncate">${item.name}</div>
            <div class="text-xs font-bold text-slate-500">${item.category} | 1打$${item.dozenPrice} / 1雙$${item.pairPrice}</div>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <div class="flex flex-col gap-0.5">
              <button onclick="moveItemOrder(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-30 cursor-not-allowed"' : ''} class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-2 py-0.5 rounded text-xs font-black">⬆️</button>
              <button onclick="moveItemOrder(${idx}, 1)" ${idx === items.length - 1 ? 'disabled class="opacity-30 cursor-not-allowed"' : ''} class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-2 py-0.5 rounded text-xs font-black">⬇️</button>
            </div>
            <button onclick="openEditItemModal('${item.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1 rounded-lg text-xs font-bold transition-all">編輯</button>
            <button onclick="deleteItem('${item.id}')" class="bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-all">刪除</button>
          </div>
        </div>
      `).join('');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('flex');
      document.getElementById(id).classList.add('hidden');
    }

    init();
  </script>
</body>
</html>
